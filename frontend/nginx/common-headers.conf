# Encabezados de seguridad comunes a los tres modos de CONSOLE_TLS_MODE
# (D55/RN-149). Compartido por include entre console-http.conf y
# console-https.conf para que no puedan divergir.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
