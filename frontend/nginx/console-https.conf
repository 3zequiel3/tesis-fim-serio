# Plantilla de la consola en CONSOLE_TLS_MODE={self_signed,provided}
# (D55/RN-149, D60/RN-154).
#
# Instalada como /etc/nginx/conf.d/default.conf por
# docker-entrypoint.d/40-fim-console-tls.sh, que resuelve con `envsubst`
# RESTRINGIDO a las tres variables abajo (nunca sin restricción: nginx usa
# `$host`, `$uri`, `$scheme`, `$remote_addr`, etc. en el resto del archivo —
# incluido el include de common-locations.conf — y un envsubst sin lista de
# variables los rompería, quedando vacíos):
#   FIM_CONSOLE_TLS_CERT   — ruta absoluta al certificado (dentro del contenedor)
#   FIM_CONSOLE_TLS_KEY    — ruta absoluta a la clave privada
#   FIM_CONSOLE_HSTS_VALUE — valor completo del header Strict-Transport-Security,
#                            distinto por modo (D60/RN-154): "self_signed" usa
#                            max-age corto sin includeSubDomains para no volver
#                            no-omisible el error de certificado autofirmado;
#                            "provided" usa max-age largo con includeSubDomains.
include /etc/nginx/fim-console/log-format.conf;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log fim_redacted;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log fim_redacted;

    ssl_certificate     $FIM_CONSOLE_TLS_CERT;
    ssl_certificate_key $FIM_CONSOLE_TLS_KEY;

    include /etc/nginx/fim-console/common-headers.conf;
    add_header Strict-Transport-Security "$FIM_CONSOLE_HSTS_VALUE" always;

    include /etc/nginx/fim-console/common-locations.conf;
}
