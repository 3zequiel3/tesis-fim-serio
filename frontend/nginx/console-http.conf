# Plantilla de la consola en CONSOLE_TLS_MODE=off (D55/RN-149).
#
# Instalada como /etc/nginx/conf.d/default.conf por
# docker-entrypoint.d/40-fim-console-tls.sh SIN sustitución de variables:
# a diferencia de console-https.conf, este modo no tiene rutas ni valores
# que resolver en tiempo de arranque.
#
# NO emite Strict-Transport-Security: HTTP en claro no puede prometer HTTPS
# futuro sin haber sido servido antes por HTTPS al menos una vez.
include /etc/nginx/fim-console/log-format.conf;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log fim_redacted;

    include /etc/nginx/fim-console/common-headers.conf;
    include /etc/nginx/fim-console/common-locations.conf;
}
