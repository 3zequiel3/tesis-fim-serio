# Redacción de credenciales del ticket SSE (y de cualquier token residual)
# en el access log de nginx (D64/RN-158).
#
# El log_format `combined` por defecto de la imagen nginx:alpine incluye
# $request completo (método + URI + query string + versión HTTP). Un
# GET /api/alerts/stream?ticket=<valor> quedaría en claro en el access log
# durante toda la vida del archivo — el ticket vence solo a los 30 segundos,
# pero el log no.
#
# Dos `map` encadenados derivan de $request una variable equivalente con los
# valores de `ticket` y `token` reemplazados por [REDACTED], preservando el
# resto de la línea intacto (nombre del parámetro, demás parámetros, método,
# path y versión HTTP). Encadenados porque un solo `map` no hace
# búsqueda-y-reemplazo arbitraria: cada uno reconstruye la línea a partir de
# los grupos capturados antes/después del valor sensible; el segundo parte
# del resultado del primero para cubrir ambos parámetros en la misma request.
# Requests sin `ticket` ni `token` caen en el `default` de cada map: pasan sin
# modificar.
#
# Incluido en contexto `http` desde console-http.conf y console-https.conf
# (ambos se instalan como conf.d/default.conf, dentro del http{} del
# nginx.conf base de la imagen — ver docker-entrypoint.d/40-fim-console-tls.sh).

map $request $fim_redact_ticket {
    "~*^(?<pre>.*[?&]ticket=)[^&\s]+(?<post>.*)$" "${pre}[REDACTED]${post}";
    default $request;
}

map $fim_redact_ticket $fim_redacted_request {
    "~*^(?<pre>.*[?&]token=)[^&\s]+(?<post>.*)$" "${pre}[REDACTED]${post}";
    default $fim_redact_ticket;
}

# Equivalente a `combined`, salvo por usar $fim_redacted_request en lugar de
# $request directamente.
log_format fim_redacted '$remote_addr - $remote_user [$time_local] '
                         '"$fim_redacted_request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
