# Bloques `location` comunes a los tres modos de CONSOLE_TLS_MODE
# (D55/RN-149). Compartido por include entre console-http.conf y
# console-https.conf para que el proxy de /api/ y /auth/refresh sea
# idéntico en ambos modos.

# Canonical same-origin refresh URL. It must remain exact because the
# HttpOnly refresh cookie is scoped to Path=/auth/refresh.
location = /auth/refresh {
    proxy_pass http://backend:8000/auth/refresh;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Proxy hacia el backend — todas las rutas bajo /api/
# El frontend usa VITE_API_URL=/api; nginx strip el prefijo antes de reenviar.
location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Cache de assets estáticos
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA fallback: todas las rutas sirven index.html
location / {
    try_files $uri $uri/ /index.html;
}
