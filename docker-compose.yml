# docker-compose.yml — FIM Platform
#
# Compose v2 (sin directiva `version:` — obsoleta desde Compose v2).
#
# Uso básico (infra sola — Done criterion de Change 01):
#   docker compose up -d db valkey n8n
#
# Uso completo (cuando backend y frontend existan en Change 02/14):
#   docker compose --profile app up -d
#
# Servicios con profiles: ["app"] (backend, frontend) NO arrancan con
# `docker compose up` sin el flag --profile app. Esto evita errores de build
# en tanto sus Dockerfiles no existan (D-05).

networks:
  fim_internal:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  n8n_data:
  backend_certs:
  agent_state:

services:

  # ---------------------------------------------------------------------------
  # db — PostgreSQL 18.3
  # Base `fim` creada por POSTGRES_DB; base `fim_n8n` creada por el script
  # SQL en db/init/ (D-02). Usuario único `fim` con ownership sobre ambas (D-03).
  # Puerto 5432 NO expuesto al host (D-04).
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: fim
      POSTGRES_USER: fim
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18+ cambió la convención: el mount va a /var/lib/postgresql
      # (NO a /var/lib/postgresql/data). La imagen guarda los datos en un
      # subdirectorio versionado /var/lib/postgresql/<major>/docker/ para
      # ser compatible con pg_ctlcluster y pg_upgrade --link entre majors.
      # Si se montara a /data como en <=17, el container detecta el mount
      # viejo como "unused" y se rehúsa a arrancar. Ver docker-library/postgres#37.
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fim_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fim -d fim"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # valkey — Valkey 9.0.3 (compatible con Redis protocol)
  # Backend ↔ agente FIM se comunican SOLO vía Valkey Streams (RN-108, D8).
  # Puerto 6379 NO expuesto al host (D-04).
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.0.3
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    networks:
      - fim_internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # n8n — n8nio/n8n 2.16.1 (notificaciones)
  # Usa la base fim_n8n con el usuario fim (D-03).
  # Puerto 5678 (UI de n8n) NO expuesto al host — acceso solo por exec (D-04).
  # Change 13 (integration-n8n-notifications) configura los workflows.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:2.16.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: fim_n8n
      DB_POSTGRESDB_USER: fim
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - fim_internal

  # ---------------------------------------------------------------------------
  # backend — FastAPI (placeholder, Change 02)
  # profiles: ["app"] → no arranca con `docker compose up` sin --profile app.
  # Puertos: 8000 (API HTTP), 8443 (mTLS para agentes FIM, RN-78).
  # deploy.replicas: 1 (RN-76 — single-instance, sin HA en M1-M4).
  # El volumen backend_certs se popula en Change 04 (agent-mtls-ca).
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    image: fim-backend:dev
    profiles:
      - app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fim:${DB_PASSWORD}@db:5432/fim
      VALKEY_URL: valkey://valkey:6379
      JWT_SECRET_CURRENT: ${JWT_SECRET_CURRENT}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CA_CERT_PATH: ${CA_CERT_PATH}
      CA_KEY_PATH: ${CA_KEY_PATH}
      BACKEND_CERT_PATH: ${BACKEND_CERT_PATH}
      BACKEND_KEY_PATH: ${BACKEND_KEY_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      # DEMO PLACEHOLDER (no es la integración real): apunta el health check de n8n
      # a /healthz (responde 200) para que el dashboard muestre n8n "online" en la
      # demo, SIN un workflow de notificaciones. NO envía notificaciones reales.
      # La integración funcional (webhook del workflow n8n) es el Change 13
      # (integration-n8n-notifications); reemplazar esta URL por ese webhook.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/healthz}
      # P1 del plan de medición (Cap. 5): rate limit de ingesta parametrizado
      # (RN-88). Los defaults reproducen el comportamiento histórico —
      # 100 eventos por ventana de 60 s y por agent_id. Subirlos SOLO para las
      # baterías de carga; también fija el retry_after del event_nack (D37/RN-131).
      RATE_LIMIT_INGEST_EVENTS: ${RATE_LIMIT_INGEST_EVENTS:-100}
      RATE_LIMIT_INGEST_WINDOW_SECONDS: ${RATE_LIMIT_INGEST_WINDOW_SECONDS:-60}
    volumes:
      - backend_certs:/certs
    ports:
      - "8443:8443"
      - "8000:8000"
    networks:
      - fim_internal
    deploy:
      replicas: 1

  # ---------------------------------------------------------------------------
  # frontend — React 19 + Vite + nginx (C17: frontend-shell-auth)
  # profiles: ["app"] → no arranca sin --profile app.
  # Puerto 80: nginx sirve el SPA compilado con headers de seguridad.
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    image: fim-frontend:dev
    profiles:
      - app
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - fim_internal

  # ---------------------------------------------------------------------------
  # agent — FIM Agent (detección fanotify, contenedor de test)
  # profiles: ["app"]. Corre como root con cap_add para fanotify.
  # Editá archivos en ./fim-watch (host) → /watch (agente) para disparar eventos.
  # Requiere registro previo del agente: scripts/setup-agent.sh
  # ---------------------------------------------------------------------------
  agent:
    build: ./agent
    image: fim-agent:dev
    profiles:
      - app
    restart: unless-stopped
    depends_on:
      - backend
      - valkey
    # fanotify: CAP_SYS_ADMIN (init + marcar filesystem) +
    # CAP_DAC_READ_SEARCH (open_by_handle_at en modo FID).
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    environment:
      # Secreto de un solo uso del bootstrap mTLS. Debe coincidir con el usado
      # al registrar el agente (scripts/setup-agent.sh).
      FIM_BOOTSTRAP_SECRET: ${FIM_BOOTSTRAP_SECRET:-docker-bootstrap-secret}
    volumes:
      # Directorio vigilado — editá archivos acá para disparar eventos.
      - ./fim-watch:/watch
      # CA del backend (solo lectura) para verificar el cert del bootstrap.
      - backend_certs:/certs:ro
      # Estado persistente (baseline cifrado, cola offline, journal, certs).
      - agent_state:/var/lib/fim-agent
      # Config del agente.
      - ./agent/deploy/config.yaml.docker:/etc/fim-agent/config.yaml:ro
    networks:
      - fim_internal
