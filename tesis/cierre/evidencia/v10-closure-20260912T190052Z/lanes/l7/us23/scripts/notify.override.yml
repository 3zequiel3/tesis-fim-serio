services:
  backend:
    image: fim-l7-us23-backend:local
    environment:
      # n8n is intentionally unreachable (connection refused, fast) so the
      # real retry cascade (5s/30s/120s) runs with nominal, non-zeroed delays.
      N8N_WEBHOOK_URL: "http://127.0.0.1:1/webhook"
      N8N_HEALTH_URL: ""
      SMTP_HOST: ${FIM_L7_SMTP_HOST}
      SMTP_PORT: ${FIM_L7_SMTP_PORT}
      SMTP_STARTTLS: "false"
      SMTP_SSL: "false"
      SMTP_FROM: "fim-alerts@lab.local"
      SMTP_TO: "soc@lab.local"
      WEBHOOK_FALLBACK_URL: ${FIM_L7_WEBHOOK_FALLBACK_URL}

  mailpit:
    image: axllent/mailpit:v1.22.3
    networks: [lab_internal]
    ports:
      - "127.0.0.1:${FIM_L7_MAILPIT_UI_PORT}:8025"

  webhook-receiver:
    image: python:3.13-slim
    networks: [lab_internal]
    volumes:
      - ${FIM_L7_RECEIVER_SCRIPT}:/receiver.py:ro
      - webhook_receiver_data:/data
    command: ["python3", "/receiver.py"]
    ports:
      - "127.0.0.1:${FIM_L7_WEBHOOK_UI_PORT}:9099"

volumes:
  webhook_receiver_data:
