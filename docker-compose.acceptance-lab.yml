# Opt-in, disposable acceptance laboratory. Always invoke it with an explicit
# project name; scripts/run-isolated-acceptance-lab.sh enforces that boundary.
networks:
  lab_internal:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  backend_certs:
  # D86/RN-180: wrapping key for the agent shared secret. Mounted only by wrap-key-init
  # (generator) and backend (read-only); the `agent` container does not see it.
  backend_secrets:
  agent_state:

services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: fim
      POSTGRES_USER: fim
      POSTGRES_PASSWORD: ${FIM_LAB_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [lab_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fim -d fim"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0.3
    volumes:
      - valkey_data:/data
    networks: [lab_internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # D86/RN-180: this backend runs without certs-init, so a one-shot generates the key first.
  wrap-key-init:
    build: ./backend
    image: fim-acceptance-backend:local
    user: "0:0"
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://fim:${FIM_LAB_DB_PASSWORD}@db:5432/fim
      VALKEY_URL: valkey://valkey:6379
      JWT_SECRET_CURRENT: ${FIM_LAB_JWT_CURRENT}
      AGENT_SECRET_WRAP_KEY_PATH: /secrets/agent-secret-wrap.key
    volumes:
      - backend_secrets:/secrets
    networks: [lab_internal]
    command: ["python", "-m", "app.core.certs_init", "--wrap-key-only"]

  backend:
    build: ./backend
    image: fim-acceptance-backend:local
    depends_on:
      wrap-key-init: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://fim:${FIM_LAB_DB_PASSWORD}@db:5432/fim
      VALKEY_URL: valkey://valkey:6379
      JWT_SECRET_CURRENT: ${FIM_LAB_JWT_CURRENT}
      JWT_SECRET_PREVIOUS: ${FIM_LAB_JWT_PREVIOUS:-}
      ADMIN_USERNAME: ${FIM_LAB_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${FIM_LAB_ADMIN_PASSWORD}
      ENVIRONMENT: dev
      CA_CERT_PATH: /certs/ca.pem
      CA_KEY_PATH: /certs/ca-key.pem
      BACKEND_CERT_PATH: /certs/backend.pem
      BACKEND_KEY_PATH: /certs/backend-key.pem
      AGENT_SECRET_WRAP_KEY_PATH: /secrets/agent-secret-wrap.key
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${FIM_LAB_FRONTEND_PORT}
      N8N_WEBHOOK_URL: ""
      N8N_HEALTH_URL: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_STARTTLS: "true"
      SMTP_SSL: "false"
      WEBHOOK_FALLBACK_URL: ""
    volumes:
      - backend_certs:/certs
      - backend_secrets:/secrets:ro
    ports:
      - "127.0.0.1:${FIM_LAB_API_PORT}:8000"
      - "127.0.0.1:${FIM_LAB_MTLS_PORT}:8443"
    networks: [lab_internal]

  frontend:
    build: ./frontend
    image: fim-acceptance-frontend:local
    depends_on: [backend]
    ports:
      - "127.0.0.1:${FIM_LAB_FRONTEND_PORT}:80"
    networks: [lab_internal]

  agent:
    build: ./agent
    image: fim-acceptance-agent:local
    depends_on:
      backend: { condition: service_started }
      valkey: { condition: service_healthy }
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    environment:
      FIM_BOOTSTRAP_SECRET: ${FIM_LAB_BOOTSTRAP_SECRET}
    volumes:
      - ${FIM_LAB_WATCH_DIR}:/watch
      - ${FIM_LAB_AGENT_CONFIG}:/etc/fim-agent/config.yaml:ro
      - backend_certs:/certs:ro
      - agent_state:/var/lib/fim-agent
    networks: [lab_internal]
