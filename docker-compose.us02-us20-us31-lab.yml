# Opt-in, disposable acceptance laboratory for US-02/US-20/US-31.
# The database init bind is intentionally absent: these stories use only the fim database,
# and avoiding that unrelated host bind keeps frozen snapshots self-contained.
networks:
  lab_internal:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  backend_certs:
  agent_state:

services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: fim
      POSTGRES_USER: fim
      POSTGRES_PASSWORD: ${FIM_LAB_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    networks: [lab_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fim -d fim"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0.3
    volumes:
      - valkey_data:/data
    networks: [lab_internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    image: fim-acceptance-backend:local
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://fim:${FIM_LAB_DB_PASSWORD}@db:5432/fim
      VALKEY_URL: valkey://valkey:6379
      JWT_SECRET_CURRENT: ${FIM_LAB_JWT_CURRENT}
      JWT_SECRET_PREVIOUS: ${FIM_LAB_JWT_PREVIOUS:-}
      ADMIN_USERNAME: ${FIM_LAB_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${FIM_LAB_ADMIN_PASSWORD}
      ENVIRONMENT: dev
      CA_CERT_PATH: /certs/ca.pem
      CA_KEY_PATH: /certs/ca-key.pem
      BACKEND_CERT_PATH: /certs/backend.pem
      BACKEND_KEY_PATH: /certs/backend-key.pem
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${FIM_LAB_FRONTEND_PORT}
      N8N_WEBHOOK_URL: ""
      N8N_HEALTH_URL: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_STARTTLS: "true"
      SMTP_SSL: "false"
      WEBHOOK_FALLBACK_URL: ""
    volumes:
      - backend_certs:/certs
    ports:
      - "127.0.0.1:${FIM_LAB_API_PORT}:8000"
      - "127.0.0.1:${FIM_LAB_MTLS_PORT}:8443"
    networks: [lab_internal]

  frontend:
    build: ./frontend
    image: fim-acceptance-frontend:local
    depends_on: [backend, sse-proxy]
    volumes:
      - ./frontend/nginx.us02-us20-us31-lab.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FIM_LAB_FRONTEND_PORT}:80"
    networks: [lab_internal]

  sse-proxy:
    image: nginx:alpine
    depends_on: [backend]
    volumes:
      - ./frontend/nginx.us20-sse-proxy.conf:/etc/nginx/nginx.conf:ro
    networks: [lab_internal]

  agent:
    build: ./agent
    image: fim-acceptance-agent:local
    depends_on:
      backend: { condition: service_started }
      valkey: { condition: service_healthy }
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    environment:
      FIM_BOOTSTRAP_SECRET: ${FIM_LAB_BOOTSTRAP_SECRET}
    volumes:
      - ${FIM_LAB_WATCH_DIR}:/watch
      - ${FIM_LAB_AGENT_CONFIG}:/etc/fim-agent/config.yaml:ro
      - backend_certs:/certs:ro
      - agent_state:/var/lib/fim-agent
    networks: [lab_internal]
