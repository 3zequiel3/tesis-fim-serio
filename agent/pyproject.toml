# Configuración de pytest del agente FIM.
#
# El agente no es un paquete distribuible (se instala con install.sh sobre el
# host, no con pip), así que este archivo existe SOLO para fijar la
# configuración de la suite: sin él pytest no encontraba ningún inifile,
# `rootdir` dependía del directorio desde el que se invocara y el conteo de la
# Batería 2 del plan de medición del Cap. 5 no era reproducible.
#
# Mismas opciones que backend/pyproject.toml, con una diferencia deliberada:
# `asyncio_mode = "strict"`. Toda la suite del agente ya marca sus tests async
# con @pytest.mark.asyncio explícito; "strict" preserva exactamente el modo con
# el que se venía corriendo y evita que un cambio de modo altere el conteo.
#
# Invocación: `pytest agent/tests/ --junitxml=...` desde la raíz del repo, o
# `pytest` parado en este directorio. NO usar `python -m pytest` desde agent/:
# eso antepone este directorio al sys.path y agent/logging.py tapa el módulo
# `logging` de la stdlib (limitación preexistente, ajena a este archivo).

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
timeout = 60
